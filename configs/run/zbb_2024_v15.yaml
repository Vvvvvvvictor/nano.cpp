# Zbb channel runtime card for 2024 v15.

extends:
  - ../base.yaml
  - ../common/nano_branches_v15.yaml
  - ../common/stored_tagger_names_v15.yaml
  - ../common/read_branches_v15.yaml

era: "2024"
nano_version: "v15"

preselection: Sum$(abs(FatJet_eta)<2.4)>1

required_triggers:
  - HLT_AK8PFJet380_SoftDropMass30
  - HLT_AK8PFJet500

output:
  include_lhe_weights: true

additional_read_branches:
  - LHEScaleWeight
  - LHEPdfWeight

channels:
  zbb:
    require_sv_cut: false
    fatjet_hlt_sf_file: data/trigger-sf/2024/trigger_sf_correctionlib.json
